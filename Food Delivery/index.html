<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Ordering System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍔 Food Ordering System</h1>

<div class="container">

  <!-- Menu -->
  <div class="menu">
    <h2>Menu</h2>
    <div id="menu-items"></div>
  </div>

  <!-- Cart -->
  <div class="cart">
    <h2>Cart</h2>
    <ul id="cart-list"></ul>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button onclick="placeOrder()">Place Order</button>
  </div>

</div>

<!-- Orders -->
<div class="orders">
  <h2>Order History</h2>
  <ul id="orders"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
