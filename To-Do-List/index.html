<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fun Student Task Board</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
<h1>🎯 My Study Mission</h1>
<p>Complete your tasks and level up 🚀</p>
</header>

<section class="task-board">

<div class="task">
<input type="checkbox" id="t1">
<label for="t1">💻 Finish Web Development Assignment</label>
</div>

<div class="task">
<input type="checkbox" id="t2">
<label for="t2">☕ Practice Java Programming</label>
</div>

<div class="task">
<input type="checkbox" id="t3">
<label for="t3">🌐 Upload Portfolio to GitHub</label>
</div>

<div class="task">
<input type="checkbox" id="t4">
<label for="t4">🤖 Study Machine Learning Concepts</label>
</div>

<div class="task">
<input type="checkbox" id="t5">
<label for="t5">📚 Prepare for Technical Interview</label>
</div>

</section>

<footer>
<p>Keep learning. Keep building. 💡</p>
</footer>

</div>

</body>
</html>
